<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" role="img" aria-labelledby="title desc">
<title id="title">Training objective comparison</title>
<desc id="desc">Model behavior from each training objective. Base model: 62.50%; Reference response only: 3.12%; Hidden state separation: 100.00%; Combined objectives: 15.62%</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Lato, Arial, sans-serif" fill="#243447">
<text x="20" y="32" font-size="23" font-weight="700">Training objective comparison</text>
<line x1="260.0" x2="260.0" y1="84" y2="265" stroke="#e1e7ed"/>
<text x="260.0" y="326" text-anchor="middle" font-size="15">0</text>
<line x1="407.5" x2="407.5" y1="84" y2="265" stroke="#e1e7ed"/>
<text x="407.5" y="326" text-anchor="middle" font-size="15">25</text>
<line x1="555.0" x2="555.0" y1="84" y2="265" stroke="#e1e7ed"/>
<text x="555.0" y="326" text-anchor="middle" font-size="15">50</text>
<line x1="702.5" x2="702.5" y1="84" y2="265" stroke="#e1e7ed"/>
<text x="702.5" y="326" text-anchor="middle" font-size="15">75</text>
<line x1="850.0" x2="850.0" y1="84" y2="265" stroke="#e1e7ed"/>
<text x="850.0" y="326" text-anchor="middle" font-size="15">100</text>
<text x="245" y="110" text-anchor="end" font-size="17">Base model</text>
<rect x="260" y="90" width="368.75" height="28" rx="3" fill="#6f7c89"/>
<text x="638.75" y="110" text-anchor="start" font-size="17" font-weight="700">62.50%</text>
<text x="245" y="157" text-anchor="end" font-size="17">Reference response only</text>
<rect x="260" y="137" width="18.4375" height="28" rx="3" fill="#22765f"/>
<text x="288.4375" y="157" text-anchor="start" font-size="17" font-weight="700">3.12%</text>
<text x="245" y="204" text-anchor="end" font-size="17">Hidden state separation</text>
<rect x="260" y="184" width="590.0" height="28" rx="3" fill="#417db0"/>
<text x="860.0" y="204" text-anchor="start" font-size="17" font-weight="700">100.00%</text>
<text x="245" y="251" text-anchor="end" font-size="17">Combined objectives</text>
<rect x="260" y="231" width="92.1875" height="28" rx="3" fill="#417db0"/>
<text x="362.1875" y="251" text-anchor="start" font-size="17" font-weight="700">15.62%</text>
<text x="555.0" y="360" text-anchor="middle" font-size="17">Injected answer or repetition (%)</text>
</g></svg>
