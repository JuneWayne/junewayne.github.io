<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 431" role="img" aria-labelledby="title desc">
<title id="title">Training objective comparison</title>
<desc id="desc">Model behavior from each training objective. Base model: 62.50%; Reference response only: 3.12%; Hidden state separation: 100.00%; Combined objectives: 15.62%</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Lato, Arial, sans-serif" fill="#243447">
<text x="16" y="30" font-size="20" font-weight="700">Training objective comparison</text>
<text x="16.0" y="391" text-anchor="start" font-size="15">0</text>
<text x="108.0" y="391" text-anchor="middle" font-size="15">25</text>
<text x="200.0" y="391" text-anchor="middle" font-size="15">50</text>
<text x="292.0" y="391" text-anchor="middle" font-size="15">75</text>
<text x="384.0" y="391" text-anchor="end" font-size="15">100</text>
<text x="16" y="107" text-anchor="start" font-size="18">Base model</text>
<rect x="16" y="118" width="230.0" height="14" rx="3" fill="#6f7c89"/>
<text x="384" y="107" text-anchor="end" font-size="17" font-weight="700">62.50%</text>
<text x="16" y="171" text-anchor="start" font-size="18">Reference response only</text>
<rect x="16" y="182" width="11.5" height="14" rx="3" fill="#22765f"/>
<text x="384" y="171" text-anchor="end" font-size="17" font-weight="700">3.12%</text>
<text x="16" y="235" text-anchor="start" font-size="18">Hidden state separation</text>
<rect x="16" y="246" width="368.0" height="14" rx="3" fill="#417db0"/>
<text x="384" y="235" text-anchor="end" font-size="17" font-weight="700">100.00%</text>
<text x="16" y="299" text-anchor="start" font-size="18">Combined objectives</text>
<rect x="16" y="310" width="57.5" height="14" rx="3" fill="#417db0"/>
<text x="384" y="299" text-anchor="end" font-size="17" font-weight="700">15.62%</text>
<text x="200.0" y="425" text-anchor="middle" font-size="17">Injected answer or repetition (%)</text>
</g></svg>
