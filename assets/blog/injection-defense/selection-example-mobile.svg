<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 277" role="img" aria-labelledby="title desc">
<title id="title">Worked selection example</title>
<desc id="desc">Illustrative probabilities · pair score = (0.90 + 0.03) / 2 = 0.465. Injection prompt: 90.00%; Safe prompt: 3.00%</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Lato, Arial, sans-serif" fill="#243447">
<text x="16" y="30" font-size="20" font-weight="700">Worked selection example</text>
<text x="16.0" y="237" text-anchor="start" font-size="15">0</text>
<text x="108.0" y="237" text-anchor="middle" font-size="15">25</text>
<text x="200.0" y="237" text-anchor="middle" font-size="15">50</text>
<text x="292.0" y="237" text-anchor="middle" font-size="15">75</text>
<text x="384.0" y="237" text-anchor="end" font-size="15">100</text>
<text x="16" y="81" text-anchor="start" font-size="18">Injection prompt</text>
<rect x="16" y="92" width="331.2" height="14" rx="3" fill="#417db0"/>
<text x="384" y="81" text-anchor="end" font-size="17" font-weight="700">90.00%</text>
<text x="16" y="145" text-anchor="start" font-size="18">Safe prompt</text>
<rect x="16" y="156" width="11.04" height="14" rx="3" fill="#417db0"/>
<text x="384" y="145" text-anchor="end" font-size="17" font-weight="700">3.00%</text>
<text x="200.0" y="271" text-anchor="middle" font-size="17">Incorrect-label probability (%)</text>
</g></svg>