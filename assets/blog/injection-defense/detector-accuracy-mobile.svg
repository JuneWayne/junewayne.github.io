<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 469" role="img" aria-labelledby="title desc">
<title id="title">Detector accuracy before data selection</title>
<desc id="desc">Same 500 validation pairs · the layer is selected separately for each detector. Logistic Regression: 99.90%; Linear SVM: 99.90%; 2 layer neural network: 99.80%; Jlens (LLMail): 53.30%; Jlens (synthetic): 53.90%</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Lato, Arial, sans-serif" fill="#243447">
<text x="16" y="30" font-size="20" font-weight="700">Detector accuracy before data selection</text>
<text x="16.0" y="429" text-anchor="start" font-size="15">0</text>
<text x="108.0" y="429" text-anchor="middle" font-size="15">25</text>
<text x="200.0" y="429" text-anchor="middle" font-size="15">50</text>
<text x="292.0" y="429" text-anchor="middle" font-size="15">75</text>
<text x="384.0" y="429" text-anchor="end" font-size="15">100</text>
<text x="16" y="81" text-anchor="start" font-size="18">Logistic Regression</text>
<rect x="16" y="92" width="367.63200000000006" height="14" rx="3" fill="#417db0"/>
<text x="384" y="81" text-anchor="end" font-size="17" font-weight="700">99.90%</text>
<text x="16" y="145" text-anchor="start" font-size="18">Linear SVM</text>
<rect x="16" y="156" width="367.63200000000006" height="14" rx="3" fill="#417db0"/>
<text x="384" y="145" text-anchor="end" font-size="17" font-weight="700">99.90%</text>
<text x="16" y="209" text-anchor="start" font-size="18">2 layer neural network</text>
<rect x="16" y="220" width="367.264" height="14" rx="3" fill="#417db0"/>
<text x="384" y="209" text-anchor="end" font-size="17" font-weight="700">99.80%</text>
<text x="16" y="273" text-anchor="start" font-size="18">Jlens (LLMail)</text>
<rect x="16" y="284" width="196.144" height="14" rx="3" fill="#417db0"/>
<text x="384" y="273" text-anchor="end" font-size="17" font-weight="700">53.30%</text>
<text x="16" y="337" text-anchor="start" font-size="18">Jlens (synthetic)</text>
<rect x="16" y="348" width="198.352" height="14" rx="3" fill="#417db0"/>
<text x="384" y="337" text-anchor="end" font-size="17" font-weight="700">53.90%</text>
<text x="200.0" y="463" text-anchor="middle" font-size="17">Validation balanced accuracy (%)</text>
</g></svg>