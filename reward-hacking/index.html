<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142322">
<title>Reward Hacking Atlas · Literature map</title>
<link rel="icon" href="mark.svg"><link rel="stylesheet" href="style.css?v=033fe875">
<script defer src="snapshot.js?v=6a5bf139"></script><script defer src="app.js?v=067e217b"></script><script defer src="vendor/d3-hierarchy.min.js"></script><script defer src="map.js?v=02bbc205"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="top wrap"><a class="brand" href="#atlas"><img src="mark.svg" alt="">Reward hacking</a><nav aria-label="Main navigation"><a href="#atlas">Map</a><a href="#library">Library</a><a href="#review">Literature review</a></nav></div></header>
<main id="main" class="wrap">
<section id="atlas" class="view">
 <div class="map-surface">
  <div class="map-title">
   <div><h1>Paper clusters</h1><p id="scope-count"></p></div>
   <div class="map-controls">
    <div role="tablist" aria-label="Bubble size" class="size-tabs">
     <button id="cited-tab" role="tab" aria-controls="cluster-panel" aria-selected="true" data-metric="citations">Citations received</button>
     <button id="refs-tab" role="tab" aria-controls="cluster-panel" aria-selected="false" tabindex="-1" data-metric="references">References</button>
    </div>
    <label class="links-switch"><input type="checkbox" id="show-links">Citation links</label>
    <button class="motion-control" id="motion" aria-label="Pause motion" title="Pause motion"></button>
   </div>
  </div>
  <div class="bubble-stage" role="tabpanel" id="cluster-panel" aria-labelledby="cited-tab">
   <canvas id="citation-lines" aria-hidden="true" hidden></canvas>
   <svg id="bubble-map" aria-label="Papers grouped by primary research contribution"></svg>
   <div id="bubble-tip" role="tooltip" hidden></div>
  </div>
 </div>
 <aside class="category-chart" aria-labelledby="chart-title">
  <h2 id="chart-title">Papers by category</h2>
  <div id="area-list"></div>

 </aside>
</section>
<section id="library" class="view" hidden>
 <div class="intro"><h1>Paper library</h1><button class="button" id="export-library">Export CSV</button></div>
 <div class="library-controls">
  <input type="search" id="query" aria-label="Search papers" placeholder="Search title, author, or year">
  <select id="area-filter" aria-label="Research category"></select>
 </div>
 <div class="list-heading"><p id="results" aria-live="polite"></p><button id="clear" class="linkbtn" hidden>Clear filters</button></div>
 <div id="library-rows"></div><div class="pagebar"><button id="prev" class="button">Previous</button><span id="page-index"></span><button id="next" class="button">Next</button></div>
</section>
<section id="review" class="view" hidden><div class="intro"><div><h1>Literature review</h1></div><a href="review.md" download class="button">Download review <span aria-hidden="true">↓</span></a></div><div class="reading"><aside class="contents panel"><a href="#review">Field overview</a><a href="#foundations">Definitions &amp; theory</a><a href="#empirical">Benchmarks &amp; behavior</a><a href="#mitigation">Detection &amp; mitigation</a><a href="#replications">Replication evidence</a><a href="#methods">Methods</a></aside><article id="review-content"></article></div></section>
<section id="methods" class="view" hidden><div class="intro"><div><h1>Methods &amp; coverage</h1></div><button class="button" id="export-data">Download dataset <span aria-hidden="true">↓</span></button></div><article class="methods" id="method-content"></article></section>
</main>

<dialog id="paper"><div class="dialog-bar"><button class="iconbtn" id="close" aria-label="Close paper details">×</button></div><div id="detail"></div></dialog>
<noscript>Enable JavaScript to explore the atlas. The <a href="review.md">literature review</a> is also available as a text file.</noscript>
</body></html>
